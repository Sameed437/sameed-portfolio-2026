<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141F"/>
      <stop offset="100%" stop-color="#1A2234"/>
    </linearGradient>
    <filter id="aiShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#080A10"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#06070C"/>
  <text x="600" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    AI ATTENDANCE SYSTEM · OPENCV + FACIAL RECOGNITION PIPELINE &amp; PARENTAL CONTROL PORTAL
  </text>

  <!-- Navigation / App Header -->
  <rect x="0" y="34" width="1200" height="66" fill="#0F121C" stroke="#1E2333" stroke-width="1"/>
  <circle cx="58" cy="67" r="16" fill="#10B981"/>
  <path d="M50 67 H66 M58 59 V75" stroke="#080A10" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="73" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="800">VISIONATTEND AI</text>
  <text x="260" y="73" fill="#10B981" font-family="monospace" font-size="11">● LIVE STREAM · 60 FPS</text>

  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#9CA3AF">
    <text x="560" y="72" fill="#10B981">LIVE RECOGNITION</text>
    <text x="730" y="72">PARENT DASHBOARD</text>
    <text x="910" y="72">ATTENDANCE LOGS</text>
  </g>
  <rect x="1060" y="50" width="100" height="34" rx="6" fill="#10B981"/>
  <text x="1110" y="72" fill="#080A10" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">REPORT</text>

  <!-- Left: Live Camera Feed with AI Bounding Box -->
  <g transform="translate(40, 120)">
    <rect width="680" height="590" rx="14" fill="url(#camGrad)" stroke="#232C40" stroke-width="1" filter="url(#aiShadow)"/>
    
    <!-- Top Stream Indicator -->
    <rect x="24" y="24" width="130" height="28" rx="14" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="1"/>
    <circle cx="38" cy="38" r="5" fill="#EF4444"/>
    <text x="50" y="42" fill="#EF4444" font-family="monospace" font-size="11" font-weight="700">CAMERA 01 · GATE A</text>

    <text x="540" y="42" fill="#9CA3AF" font-family="monospace" font-size="11">1920x1080 @ 30ms</text>

    <!-- Center Camera Silhouette / Subject -->
    <g transform="translate(180, 100)">
      <circle cx="160" cy="140" r="80" fill="#202A3C"/>
      <path d="M40 380 C 40 250, 280 250, 280 380 Z" fill="#202A3C"/>

      <!-- Facial Landmark Points -->
      <circle cx="135" cy="130" r="4" fill="#10B981"/>
      <circle cx="185" cy="130" r="4" fill="#10B981"/>
      <circle cx="160" cy="155" r="3" fill="#10B981"/>
      <path d="M140 180 Q 160 195 180 180" stroke="#10B981" stroke-width="2" fill="none"/>

      <!-- Facial Bounding Box -->
      <rect x="60" y="40" width="200" height="210" rx="4" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="16 8"/>
      
      <!-- Corner Markers -->
      <path d="M50 40 H70 M50 40 V60" stroke="#10B981" stroke-width="4" fill="none"/>
      <path d="M270 40 H250 M270 40 V60" stroke="#10B981" stroke-width="4" fill="none"/>
      <path d="M50 260 H70 M50 260 V240" stroke="#10B981" stroke-width="4" fill="none"/>
      <path d="M270 260 H250 M270 260 V240" stroke="#10B981" stroke-width="4" fill="none"/>

      <!-- Recognition Tag Overlay -->
      <rect x="60" y="5" width="200" height="30" rx="4" fill="#10B981"/>
      <text x="160" y="25" fill="#080A10" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">
        MATCH: SAMEED (98.6%)
      </text>
    </g>

    <!-- Bottom Metrics Strip -->
    <rect x="24" y="520" width="632" height="46" rx="8" fill="#10141E" stroke="#1F2636" stroke-width="1"/>
    <text x="44" y="548" fill="#9CA3AF" font-family="sans-serif" font-size="12">Model: HaarCascade + FaceNet</text>
    <text x="280" y="548" fill="#10B981" font-family="monospace" font-size="12">Inference: 18.2ms</text>
    <text x="460" y="548" fill="#60A5FA" font-family="monospace" font-size="12">Status: VERIFIED &amp; LOGGED</text>
  </g>

  <!-- Right: Real-time Attendance Feed & Parental Notification -->
  <g transform="translate(745, 120)">
    <!-- Right Card 1: Today's Verified Log -->
    <rect width="415" height="340" rx="14" fill="#111520" stroke="#222B3D" stroke-width="1" filter="url(#aiShadow)"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Real-Time Detection Feed</text>
    <text x="320" y="38" fill="#10B981" font-family="monospace" font-size="12">LIVE</text>

    <!-- Log Items -->
    <g transform="translate(24, 65)">
      <rect width="367" height="52" rx="8" fill="#161C2A" stroke="#263145" stroke-width="1"/>
      <circle cx="28" cy="26" r="14" fill="#10B981"/>
      <text x="56" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Sameed Chaudhary</text>
      <text x="56" y="38" fill="#9CA3AF" font-family="sans-serif" font-size="11">ID: #CS-2024 · Computer Science</text>
      <text x="290" y="30" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">08:04:12 AM</text>
    </g>

    <g transform="translate(24, 128)">
      <rect width="367" height="52" rx="8" fill="#161C2A" stroke="#263145" stroke-width="1"/>
      <circle cx="28" cy="26" r="14" fill="#10B981"/>
      <text x="56" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Daniyal Khan</text>
      <text x="56" y="38" fill="#9CA3AF" font-family="sans-serif" font-size="11">ID: #CS-2028 · Computer Science</text>
      <text x="290" y="30" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">08:05:40 AM</text>
    </g>

    <g transform="translate(24, 191)">
      <rect width="367" height="52" rx="8" fill="#161C2A" stroke="#263145" stroke-width="1"/>
      <circle cx="28" cy="26" r="14" fill="#10B981"/>
      <text x="56" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Fatima Noor</text>
      <text x="56" y="38" fill="#9CA3AF" font-family="sans-serif" font-size="11">ID: #SE-1940 · Software Eng</text>
      <text x="290" y="30" fill="#10B981" font-family="monospace" font-size="12" font-weight="700">08:07:15 AM</text>
    </g>

    <g transform="translate(24, 254)">
      <rect width="367" height="52" rx="8" fill="#161C2A" stroke="#263145" stroke-width="1"/>
      <circle cx="28" cy="26" r="14" fill="#3B82F6"/>
      <text x="56" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Ali Raza</text>
      <text x="56" y="38" fill="#9CA3AF" font-family="sans-serif" font-size="11">ID: #EE-1412 · Electrical Eng</text>
      <text x="290" y="30" fill="#3B82F6" font-family="monospace" font-size="12" font-weight="700">08:09:02 AM</text>
    </g>

    <!-- Right Card 2: Parental Control SMS & Push Alert Dispatcher -->
    <g transform="translate(0, 360)">
      <rect width="415" height="230" rx="14" fill="#111520" stroke="#222B3D" stroke-width="1" filter="url(#aiShadow)"/>
      <text x="24" y="36" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">PARENTAL CONTROL ENGINE</text>
      <text x="24" y="62" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Automated Push &amp; SMS Dispatch</text>

      <rect x="24" y="80" width="367" height="74" rx="8" fill="#1A1F2D" stroke="#2A354A" stroke-width="1"/>
      <text x="40" y="105" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">STATUS: SENT VIA TWILIO / WHATSAPP</text>
      <text x="40" y="125" fill="#CBD5E1" font-family="sans-serif" font-size="12">
        "Dear Parent, Sameed reached campus safely at 08:04 AM. Attendance confirmed."
      </text>

      <rect x="24" y="168" width="367" height="38" rx="6" fill="#161D2B" stroke="#2B364C" stroke-width="1"/>
      <text x="195" y="192" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Policy Enforcement &amp; Parent App →</text>
    </g>
  </g>
</svg>
