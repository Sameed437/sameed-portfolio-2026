    </text>
    <text x="24" y="140" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="700">Plans from $299/mo →</text>
  </g>

  <g transform="translate(810, 520)">
    <rect x="0" y="0" width="350" height="190" rx="12" fill="#111827" stroke="#252F40" stroke-width="1"/>
    <text x="24" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Strategic Tax Prep</text>
    <text x="24" y="70" fill="#9CA3AF" font-family="sans-serif" font-size="12">
      Form 1120-S, 1065, Schedule C and California state franchise tax filings handled with zero headaches.
    </text>
    <text x="24" y="140" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="700">Book Free Tax Review →</text>
  </g>
</svg>
