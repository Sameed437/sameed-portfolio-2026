  <rect x="80" y="325" width="180" height="42" rx="6" fill="url(#amberGold)"/>
  <text x="170" y="351" fill="#0B0F17" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">CLAIM FREE TAX REVIEW</text>

  <!-- Lead Capture Form Card on Right -->
  <g transform="translate(730, 142)">
    <rect width="390" height="230" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="24" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Request Instant Consultation</text>
    <text x="24" y="52" fill="#9CA3AF" font-family="sans-serif" font-size="11">Get an expert quote within 2 hours</text>

