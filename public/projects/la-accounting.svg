  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="350" height="190" rx="12" fill="#111827" stroke="#252F40" stroke-width="1"/>
    <text x="24" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Year-End Catch-Up</text>
