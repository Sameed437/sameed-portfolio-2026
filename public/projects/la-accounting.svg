    <text x="650" y="73">YEAR-END CLEANUP</text>
    <text x="820" y="73">TAX RESOLUTION</text>
    <text x="960" y="73">CASE STUDIES</text>
  </g>
  <rect x="1050" y="52" width="110" height="32" rx="6" fill="#F59E0B"/>
  <text x="1105" y="73" fill="#0B0F17" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">CALL NOW</text>

  <!-- Hero Section with Dual Lead-Gen Funnel -->
  <rect x="40" y="122" width="1120" height="270" rx="16" fill="url(#laHeroGrad)" stroke="#2B3648" stroke-width="1" filter="url(#laShadow)"/>
  
  <text x="80" y="170" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2">TOP-RATED LOS ANGELES BOOKKEEPING &amp; TAX FIRM</text>
  <text x="80" y="215" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">Get Your Books Done Right.</text>
  <text x="80" y="255" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">Never Worry About Tax Season.</text>
  <text x="80" y="295" fill="#9CA3AF" font-family="sans-serif" font-size="14">
    Catch up months of overdue bookkeeping in days. Maximize deductions and save thousands.
