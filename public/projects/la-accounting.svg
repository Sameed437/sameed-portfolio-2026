      <text x="110" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">LA Businesses</text>
      <text x="110" y="32" fill="#6B7280" font-family="sans-serif" font-size="11">Served Since 2021</text>
