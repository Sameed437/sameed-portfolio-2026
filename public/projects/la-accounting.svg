      <text x="90" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Google Rating</text>
      <text x="90" y="32" fill="#6B7280" font-family="sans-serif" font-size="11">140+ Client Reviews</text>
