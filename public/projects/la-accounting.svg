    <text x="36" y="89" fill="#9CA3AF" font-family="sans-serif" font-size="12">Full Name</text>

    <rect x="24" y="112" width="342" height="34" rx="6" fill="#1F2937" stroke="#4B5563" stroke-width="1"/>
    <text x="36" y="133" fill="#9CA3AF" font-family="sans-serif" font-size="12">Work Email or Phone</text>

    <rect x="24" y="160" width="342" height="40" rx="6" fill="#F59E0B"/>
    <text x="195" y="185" fill="#0B0F17" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">SCHEDULE FREE CALL →</text>
