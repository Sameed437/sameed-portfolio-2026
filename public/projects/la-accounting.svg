  <text x="600" y="22" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    LAACCOUNTINGPRO.COM — LOS ANGELES VIRTUAL ACCOUNTING &amp; HIGH-CONVERSION LEAD FUNNEL
  </text>

  <!-- Navbar -->
  <rect x="0" y="34" width="1200" height="68" fill="#131B29" stroke="#232E42" stroke-width="1"/>
  <rect x="50" y="52" width="34" height="32" rx="4" fill="#F59E0B"/>
  <text x="67" y="74" fill="#0B0F17" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">LA</text>
  <text x="96" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">ACCOUNTING</text>
  <text x="236" y="74" fill="#F59E0B" font-family="sans-serif" font-size="14" font-weight="700">PRO</text>

  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#9CA3AF">
