    <g transform="translate(360, 26)">
      <text x="0" y="24" fill="#10B981" font-family="monospace" font-size="28" font-weight="800">$4.2M+</text>
      <text x="130" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Tax Deductions</text>
      <text x="130" y="32" fill="#6B7280" font-family="sans-serif" font-size="11">Identified for Clients</text>
    </g>
    <g transform="translate(680, 26)">
      <text x="0" y="24" fill="#3B82F6" font-family="monospace" font-size="28" font-weight="800">48h</text>
      <text x="80" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Cleanup Turnaround</text>
      <text x="80" y="32" fill="#6B7280" font-family="sans-serif" font-size="11">For Past Due Months</text>
    </g>
    <g transform="translate(940, 26)">
