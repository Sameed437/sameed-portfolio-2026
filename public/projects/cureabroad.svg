  </text>

  <!-- Hero Buttons -->
  <rect x="80" y="325" width="170" height="40" rx="6" fill="#3FB9A3"/>
  <text x="165" y="350" fill="#153F3E" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">REQUEST A QUOTE</text>

  <rect x="264" y="325" width="160" height="40" rx="6" fill="transparent" stroke="#B7F9EC" stroke-width="1.5"/>
