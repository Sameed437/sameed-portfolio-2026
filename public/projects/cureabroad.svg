    <text x="24" y="36" fill="#B7F9EC" font-family="sans-serif" font-size="12" font-weight="700">PATIENT ADVISORY METRICS</text>
    
    <text x="24" y="75" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="26" font-weight="800">100%</text>
    <text x="110" y="72" fill="#D3EFEB" font-family="sans-serif" font-size="12">Accredited Partner Hospitals</text>

    <text x="24" y="120" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="26" font-weight="800">24/7</text>
    <text x="110" y="117" fill="#D3EFEB" font-family="sans-serif" font-size="12">Dedicated Patient Care Coordinator</text>

    <text x="24" y="165" fill="#3FB9A3" font-family="'Montserrat', sans-serif" font-size="26" font-weight="800">60-70%</text>
    <text x="135" y="162" fill="#D3EFEB" font-family="sans-serif" font-size="12">Average Cost Savings vs US/UK</text>
  </g>

