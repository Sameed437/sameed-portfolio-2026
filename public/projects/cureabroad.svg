<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="caHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143e3d"/>
      <stop offset="100%" stop-color="#246a68"/>
    </linearGradient>
    <linearGradient id="caCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f9f8"/>
    </linearGradient>
    <filter id="caShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#153f3e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#F4F8F7"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#1C5351"/>
  <text x="600" y="22" fill="#B7F9EC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    CUREABROADHEALTHSOLUTIONS.COM — CROSS-BORDER HEALTHCARE &amp; MEDICAL TOURISM
  </text>

  <!-- Nav Header -->
  <rect x="0" y="34" width="1200" height="70" fill="#FFFFFF" stroke="#E0ECE9" stroke-width="1"/>
  <circle cx="65" cy="69" r="16" fill="#2B7A78"/>
  <path d="M60 69 H70 M65 64 V74" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="92" y="75" fill="#153F3E" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800">CURE ABROAD</text>
  <text x="250" y="75" fill="#3FB9A3" font-family="sans-serif" font-size="11" font-weight="700">HEALTH SOLUTIONS</text>

