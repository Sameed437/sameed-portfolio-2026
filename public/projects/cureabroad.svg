    <text x="690" y="74">SPECIALTIES</text>
    <text x="810" y="74">HOSPITALS</text>
    <text x="920" y="74">FOR PATIENTS</text>
  </g>

  <rect x="1040" y="52" width="120" height="34" rx="17" fill="#2B7A78"/>
  <text x="1100" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">BOOK CONSULT</text>

  <!-- Hero Banner -->
  <rect x="40" y="124" width="1120" height="260" rx="16" fill="url(#caHeroGrad)" filter="url(#caShadow)"/>
  
  <text x="80" y="170" fill="#B7F9EC" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="2">INTERNATIONAL HEALTHCARE FACILITATION</text>
  <text x="80" y="215" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="34" font-weight="800">World-Class Treatment,</text>
  <text x="80" y="255" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="34" font-weight="800">Coordinated End-to-End.</text>
  
  <text x="80" y="295" fill="#D3EFEB" font-family="sans-serif" font-size="14">
