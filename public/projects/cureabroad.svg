    <text x="130" y="206" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">View Specialists</text>
  </g>

  <g transform="translate(610, 465)">
    <!-- Card 3 -->
    <rect x="0" y="0" width="260" height="240" rx="12" fill="#FFFFFF" stroke="#D7E6E3" stroke-width="1" filter="url(#caShadow)"/>
    <rect x="20" y="20" width="46" height="46" rx="8" fill="#E8F6F4"/>
    <circle cx="43" cy="43" r="10" fill="#A68A64"/>
    <text x="20" y="96" fill="#153F3E" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700">Oncology Care</text>
    <text x="20" y="122" fill="#5F7A78" font-family="sans-serif" font-size="12">
