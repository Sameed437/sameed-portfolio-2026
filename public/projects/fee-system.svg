<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="feeCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0E121A"/>
    </linearGradient>
    <filter id="feeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#0A0C12"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#07090E"/>
  <text x="600" y="22" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    SCHOOL FEE LIFECYCLE &amp; FINANCIAL MANAGEMENT SYSTEM — DATABASE-BACKED ADMIN PORTAL
  </text>

  <!-- Navigation / App Header -->
  <rect x="0" y="34" width="1200" height="66" fill="#10141D" stroke="#1F2636" stroke-width="1"/>
  <circle cx="58" cy="67" r="16" fill="#3B82F6"/>
  <path d="M52 68 L56 72 L64 62" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="86" y="73" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="800">EDUFEE PORTAL</text>
  <text x="240" y="73" fill="#6B7280" font-family="monospace" font-size="11">ACADEMIC YEAR 2025-2026</text>

  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#9CA3AF">
    <text x="540" y="72" fill="#60A5FA">DASHBOARD</text>
    <text x="660" y="72">STUDENT RECORDS</text>
    <text x="820" y="72">FEE STRUCTURES</text>
    <text x="960" y="72">VOUCHERS</text>
  </g>
  <rect x="1060" y="50" width="100" height="34" rx="6" fill="#3B82F6"/>
  <text x="1110" y="72" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+ COLLECT</text>

  <!-- Left Sidebar (Desktop App Style) -->
  <rect x="30" y="120" width="220" height="600" rx="12" fill="#111622" stroke="#1F283A" stroke-width="1"/>
  <g transform="translate(48, 150)" font-family="sans-serif" font-size="13" font-weight="600">
    <rect x="-8" y="-8" width="200" height="38" rx="6" fill="#1E293B"/>
    <text x="14" y="16" fill="#60A5FA">Overview &amp; Metrics</text>
    <text x="14" y="58" fill="#9CA3AF">All Students (1,480)</text>
    <text x="14" y="98" fill="#9CA3AF">Pending Challans (82)</text>
    <text x="14" y="138" fill="#9CA3AF">Payment History</text>
    <text x="14" y="178" fill="#9CA3AF">Scholarships &amp; Waivers</text>
    <text x="14" y="218" fill="#9CA3AF">Tax &amp; Audit Logs</text>
    <text x="14" y="258" fill="#9CA3AF">Relational DB Backup</text>
  </g>

  <!-- Main Content Area -->
  <!-- Stats Row -->
  <g transform="translate(270, 120)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="280" height="90" rx="10" fill="url(#feeCardGrad)" stroke="#222C3F" stroke-width="1" filter="url(#feeShadow)"/>
    <text x="20" y="32" fill="#9CA3AF" font-family="sans-serif" font-size="12">Total Fees Collected (MTD)</text>
    <text x="20" y="68" fill="#10B981" font-family="monospace" font-size="26" font-weight="800">PKR 14.8M</text>
    <text x="210" y="65" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">+12% vs last mo</text>

    <!-- Stat 2 -->
    <rect x="300" y="0" width="280" height="90" rx="10" fill="url(#feeCardGrad)" stroke="#222C3F" stroke-width="1" filter="url(#feeShadow)"/>
    <text x="20" y="32" fill="#9CA3AF" font-family="sans-serif" font-size="12">Outstanding Balance</text>
    <text x="20" y="68" fill="#F59E0B" font-family="monospace" font-size="26" font-weight="800">PKR 840,000</text>
    <text x="205" y="65" fill="#F59E0B" font-family="sans-serif" font-size="11">82 Invoices</text>

    <!-- Stat 3 -->
    <rect x="600" y="0" width="300" height="90" rx="10" fill="url(#feeCardGrad)" stroke="#222C3F" stroke-width="1" filter="url(#feeShadow)"/>
    <text x="20" y="32" fill="#9CA3AF" font-family="sans-serif" font-size="12">Collection Efficiency Rate</text>
    <text x="20" y="68" fill="#60A5FA" font-family="monospace" font-size="26" font-weight="800">94.6%</text>
    <text x="220" y="65" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="700">Healthy</text>
  </g>

  <!-- Table View: Student Fee Records -->
  <g transform="translate(270, 230)">
    <rect x="0" y="0" width="900" height="490" rx="12" fill="#0E121B" stroke="#1F283A" stroke-width="1" filter="url(#feeShadow)"/>
    
    <!-- Table Header Tools -->
    <text x="24" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Recent Fee Transactions &amp; Student Ledgers</text>
    
    <rect x="520" y="16" width="240" height="34" rx="6" fill="#161D2B" stroke="#2B364C" stroke-width="1"/>
    <text x="540" y="38" fill="#6B7280" font-family="sans-serif" font-size="12">Search student, roll #, grade...</text>

    <rect x="780" y="16" width="96" height="34" rx="6" fill="#202A3C" stroke="#35435E" stroke-width="1"/>
    <text x="828" y="38" fill="#60A5FA" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Export CSV</text>

    <!-- Columns Header -->
    <rect x="0" y="68" width="900" height="36" fill="#141A26"/>
    <g transform="translate(24, 91)" font-family="monospace" font-size="11" font-weight="700" fill="#9CA3AF">
      <text x="0" y="0">ROLL #</text>
      <text x="90" y="0">STUDENT NAME</text>
      <text x="260" y="0">CLASS &amp; SEC</text>
      <text x="390" y="0">FEE TYPE</text>
      <text x="510" y="0">AMOUNT</text>
      <text x="630" y="0">DATE</text>
      <text x="740" y="0">STATUS</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(24, 134)" font-family="sans-serif" font-size="13" fill="#D1D5DB">
      <text x="0" y="0" font-family="monospace" fill="#60A5FA">#2026-081</text>
      <text x="90" y="0" font-weight="600" fill="#FFFFFF">Hamza Tariq</text>
      <text x="260" y="0">Grade 10-A</text>
      <text x="390" y="0">Tuition + Lab</text>
      <text x="510" y="0" font-family="monospace" font-weight="700">PKR 18,500</text>
      <text x="630" y="0" font-size="12" fill="#9CA3AF">26 Oct 2026</text>
      <rect x="740" y="-14" width="70" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="775" y="1" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">PAID</text>
    </g>
    <line x1="0" y1="152" x2="900" y2="152" stroke="#1A2130" stroke-width="1"/>

    <!-- Row 2 -->
    <g transform="translate(24, 184)" font-family="sans-serif" font-size="13" fill="#D1D5DB">
      <text x="0" y="0" font-family="monospace" fill="#60A5FA">#2026-082</text>
      <text x="90" y="0" font-weight="600" fill="#FFFFFF">Ayesha Malik</text>
      <text x="260" y="0">Grade 8-B</text>
      <text x="390" y="0">Monthly Tuition</text>
      <text x="510" y="0" font-family="monospace" font-weight="700">PKR 14,200</text>
      <text x="630" y="0" font-size="12" fill="#9CA3AF">25 Oct 2026</text>
      <rect x="740" y="-14" width="70" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="775" y="1" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">PAID</text>
    </g>
    <line x1="0" y1="202" x2="900" y2="202" stroke="#1A2130" stroke-width="1"/>

    <!-- Row 3 -->
    <g transform="translate(24, 234)" font-family="sans-serif" font-size="13" fill="#D1D5DB">
      <text x="0" y="0" font-family="monospace" fill="#60A5FA">#2026-083</text>
      <text x="90" y="0" font-weight="600" fill="#FFFFFF">Zainab Fatima</text>
      <text x="260" y="0">Grade 11-Pre Med</text>
      <text x="390" y="0">Quarterly Fee</text>
      <text x="510" y="0" font-family="monospace" font-weight="700">PKR 32,000</text>
      <text x="630" y="0" font-size="12" fill="#9CA3AF">Pending</text>
      <rect x="740" y="-14" width="70" height="22" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="775" y="1" fill="#F59E0B" font-size="11" font-weight="700" text-anchor="middle">DUE</text>
    </g>
    <line x1="0" y1="252" x2="900" y2="252" stroke="#1A2130" stroke-width="1"/>

    <!-- Row 4 -->
    <g transform="translate(24, 284)" font-family="sans-serif" font-size="13" fill="#D1D5DB">
      <text x="0" y="0" font-family="monospace" fill="#60A5FA">#2026-084</text>
      <text x="90" y="0" font-weight="600" fill="#FFFFFF">Bilal Ahmed</text>
      <text x="260" y="0">Grade 9-C</text>
      <text x="390" y="0">Tuition + Transport</text>
      <text x="510" y="0" font-family="monospace" font-weight="700">PKR 19,000</text>
      <text x="630" y="0" font-size="12" fill="#9CA3AF">24 Oct 2026</text>
      <rect x="740" y="-14" width="70" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="775" y="1" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">PAID</text>
    </g>
    <line x1="0" y1="302" x2="900" y2="302" stroke="#1A2130" stroke-width="1"/>

    <!-- Row 5 -->
    <g transform="translate(24, 334)" font-family="sans-serif" font-size="13" fill="#D1D5DB">
      <text x="0" y="0" font-family="monospace" fill="#60A5FA">#2026-085</text>
      <text x="90" y="0" font-weight="600" fill="#FFFFFF">Muhammad Usman</text>
      <text x="260" y="0">Grade 7-A</text>
      <text x="390" y="0">Admission Installment</text>
      <text x="510" y="0" font-family="monospace" font-weight="700">PKR 25,000</text>
      <text x="630" y="0" font-size="12" fill="#9CA3AF">Overdue 3 days</text>
      <rect x="740" y="-14" width="70" height="22" rx="4" fill="rgba(239, 68, 68, 0.15)"/>
      <text x="775" y="1" fill="#EF4444" font-size="11" font-weight="700" text-anchor="middle">OVERDUE</text>
    </g>
  </g>
</svg>
