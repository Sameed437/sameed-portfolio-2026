<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="seaHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192b"/>
      <stop offset="100%" stop-color="#182c4d"/>
    </linearGradient>
    <filter id="seaShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#0A0F1A"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#080C14"/>
  <text x="600" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    SEATTLECITYACCOUNTING.COM — VIRTUAL BOOKKEEPING &amp; FRACTIONAL CFO SERVICES
  </text>

  <!-- Navbar -->
  <rect x="0" y="34" width="1200" height="68" fill="#111A2C" stroke="#202D45" stroke-width="1"/>
  <rect x="50" y="52" width="32" height="32" rx="6" fill="#38BDF8"/>
  <path d="M58 72 L66 60 L74 72 Z" fill="#0A0F1A"/>
  <text x="94" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">SEATTLE CITY</text>
  <text x="235" y="74" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="600">ACCOUNTING</text>

  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#A8B7D1">
