    <text x="690" y="73">PAYROLL &amp; TAX</text>
    <text x="820" y="73">FRACTIONAL CFO</text>
    <text x="960" y="73">PRICING</text>
  </g>
  <rect x="1040" y="51" width="120" height="34" rx="6" fill="#38BDF8"/>
  <text x="1100" y="73" fill="#09111E" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">BOOK A CALL</text>

  <!-- Hero Section -->
  <rect x="40" y="122" width="1120" height="260" rx="16" fill="url(#seaHeroGrad)" stroke="#223352" stroke-width="1" filter="url(#seaShadow)"/>
  <text x="80" y="170" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2">SEATTLE, WASHINGTON · VIRTUAL CPA PRACTICE</text>
  <text x="80" y="215" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">Clear Financials.</text>
  <text x="80" y="255" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">Confident Decisions.</text>
  <text x="80" y="295" fill="#A4B7D6" font-family="sans-serif" font-size="14">
    Comprehensive bookkeeping, payroll, tax prep, and fractional CFO advisory for growing businesses.
  </text>

  <rect x="80" y="325" width="160" height="40" rx="6" fill="#38BDF8"/>
  <text x="160" y="350" fill="#0A0F1A" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">FREE CONSULTATION</text>

  <!-- Right Financial Snapshot Card -->
  <g transform="translate(760, 145)">
    <rect width="360" height="214" rx="12" fill="#0E1726" stroke="#253858" stroke-width="1"/>
    <text x="24" y="36" fill="#A8B7D1" font-family="sans-serif" font-size="12" font-weight="600">CLIENT REVENUE PULSE</text>
    <text x="24" y="74" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="800">$1,420,850</text>
    <text x="200" y="70" fill="#4ADE80" font-family="sans-serif" font-size="13" font-weight="700">+28.4% YoY</text>

    <!-- Chart Sparkline -->
    <path d="M24 140 Q 60 110, 100 130 T 180 90 T 260 110 T 330 65" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="330" cy="65" r="5" fill="#38BDF8"/>
    
    <text x="24" y="180" fill="#697C99" font-family="sans-serif" font-size="11">Clean Ledger Reconciliations</text>
    <text x="220" y="180" fill="#4ADE80" font-family="monospace" font-size="12">100% Tax Compliant</text>
  </g>

  <!-- Services Strip -->
  <g transform="translate(40, 410)">
    <text x="0" y="0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">SPECIALIZED ACCOUNTING SERVICES</text>
    <text x="0" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="700">Built for Modern Businesses &amp; Founders</text>
  </g>

  <!-- 3 Service Cards -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="350" height="240" rx="12" fill="#10192A" stroke="#223350" stroke-width="1" filter="url(#seaShadow)"/>
    <rect x="24" y="24" width="44" height="44" rx="8" fill="#172740"/>
    <text x="24" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">Full-Charge Bookkeeping</text>
    <text x="24" y="130" fill="#8FA2C2" font-family="sans-serif" font-size="13" max-width="300">
