    </text>
    <rect x="24" y="180" width="130" height="34" rx="6" fill="#1E3252"/>
    <text x="89" y="202" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Learn More →</text>
  </g>

  <g transform="translate(425, 460)">
    <rect x="0" y="0" width="350" height="240" rx="12" fill="#10192A" stroke="#223350" stroke-width="1" filter="url(#seaShadow)"/>
    <rect x="24" y="24" width="44" height="44" rx="8" fill="#172740"/>
    <text x="24" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">Payroll &amp; Tax Preparation</text>
    <text x="24" y="130" fill="#8FA2C2" font-family="sans-serif" font-size="13">
