<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="rpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#18233C"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="rpShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#0A0E17"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#060910"/>
  <text x="600" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
    SAMEED CHAUDHARY — INTERACTIVE REACT FRONT-END PORTFOLIO &amp; SHOWCASE
  </text>

  <!-- Navbar -->
  <rect x="0" y="34" width="1200" height="68" fill="#0F1626" stroke="#1D2A44" stroke-width="1"/>
  <circle cx="58" cy="68" r="16" fill="#06B6D4"/>
  <text x="58" y="74" fill="#0A0E17" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
  <text x="88" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="800">SAMEED.DEV</text>

  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#94A3B8">
    <text x="560" y="73">PROJECTS</text>
    <text x="670" y="73">SKILLS</text>
    <text x="760" y="73">EXPERIENCE</text>
    <text x="880" y="73">CONTACT</text>
  </g>
  <rect x="1030" y="52" width="125" height="32" rx="6" fill="#06B6D4"/>
  <text x="1092" y="73" fill="#0A0E17" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">GITHUB REPO</text>

  <!-- Hero Section -->
  <rect x="40" y="122" width="1120" height="260" rx="16" fill="url(#rpGrad)" stroke="#233557" stroke-width="1" filter="url(#rpShadow)"/>
  <text x="80" y="170" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">FRONT-END ENGINEER · REACT &amp; JAVASCRIPT</text>
  <text x="80" y="215" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">Crafting High-Performance</text>
  <text x="80" y="255" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">Web Experiences.</text>
  <text x="80" y="295" fill="#94A3B8" font-family="sans-serif" font-size="14">
    React applications with smooth micro-interactions, responsive architecture, and modular state management.
  </text>

  <rect x="80" y="325" width="160" height="40" rx="6" fill="url(#cyanGrad)"/>
  <text x="160" y="350" fill="#0A0E17" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">VIEW PORTFOLIO</text>

  <!-- Right Visual / Interactive Code Card -->
  <g transform="translate(760, 145)">
    <rect width="360" height="214" rx="12" fill="#0B101C" stroke="#1E2C48" stroke-width="1"/>
    <!-- Code Editor Header -->
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>
    <text x="75" y="24" fill="#64748B" font-family="monospace" font-size="11">PortfolioComponent.jsx</text>
    <line x1="0" y1="36" x2="360" y2="36" stroke="#1A253C" stroke-width="1"/>

    <g transform="translate(20, 60)" font-family="monospace" font-size="12">
      <text x="0" y="0" fill="#F472B6">import</text>
      <text x="50" y="0" fill="#E2E8F0">React, { useState } from 'react';</text>
      
      <text x="0" y="25" fill="#60A5FA">export default function</text>
      <text x="175" y="25" fill="#FBBF24">Showcase</text>
      <text x="235" y="25" fill="#E2E8F0">() {</text>

      <text x="15" y="50" fill="#F472B6">const</text>
      <text x="60" y="50" fill="#E2E8F0">[projects, setProjects] =</text>
      <text x="15" y="75" fill="#38BDF8">  usePortfolioState();</text>

      <text x="15" y="105" fill="#F472B6">return</text>
      <text x="65" y="105" fill="#34D399">&lt;ModernGrid</text>
      <text x="155" y="105" fill="#FBBF24">items=</text>
      <text x="195" y="105" fill="#E2E8F0">{projects} /&gt;</text>
      
      <text x="0" y="130" fill="#E2E8F0">}</text>
    </g>
  </g>

  <!-- Skills Row -->
  <g transform="translate(40, 420)">
    <rect width="1120" height="90" rx="12" fill="#0F1524" stroke="#1E2A42" stroke-width="1"/>
    <text x="30" y="32" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">CORE TECH STACK</text>
    <g transform="translate(30, 60)" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
      <text x="0" y="0">⚛️ React.js</text>
      <text x="140" y="0">🔷 TypeScript</text>
      <text x="300" y="0">🎨 Tailwind CSS</text>
      <text x="470" y="0">⚡ Next.js SSR</text>
      <text x="630" y="0">📦 Redux / Zustand</text>
      <text x="820" y="0">🚀 Framer Motion</text>
      <text x="1000" y="0">🌐 REST APIs</text>
    </g>
  </g>

  <!-- Interactive Project Showcase Previews -->
  <g transform="translate(40, 530)">
    <rect x="0" y="0" width="350" height="180" rx="12" fill="#0D1322" stroke="#1D2A42" stroke-width="1" filter="url(#rpShadow)"/>
    <text x="24" y="40" fill="#38BDF8" font-family="monospace" font-size="11">FEATURED PROJECT 01</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Animated Component Library</text>
    <text x="24" y="98" fill="#94A3B8" font-family="sans-serif" font-size="12">
      Reusable UI system with accessible modals, carousels, and accordion components.
    </text>
    <text x="24" y="150" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">View Live Demo →</text>
  </g>

  <g transform="translate(425, 530)">
    <rect x="0" y="0" width="350" height="180" rx="12" fill="#0D1322" stroke="#1D2A42" stroke-width="1" filter="url(#rpShadow)"/>
    <text x="24" y="40" fill="#38BDF8" font-family="monospace" font-size="11">FEATURED PROJECT 02</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Real-Time Search Matrix</text>
    <text x="24" y="98" fill="#94A3B8" font-family="sans-serif" font-size="12">
      Client-side fuzzy search with debouncing, sorting, and tag filtering in pure React.
    </text>
    <text x="24" y="150" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">View Live Demo →</text>
  </g>

  <g transform="translate(810, 530)">
    <rect x="0" y="0" width="350" height="180" rx="12" fill="#0D1322" stroke="#1D2A42" stroke-width="1" filter="url(#rpShadow)"/>
    <text x="24" y="40" fill="#38BDF8" font-family="monospace" font-size="11">FEATURED PROJECT 03</text>
    <text x="24" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">CSS Grid Layout Generator</text>
    <text x="24" y="98" fill="#94A3B8" font-family="sans-serif" font-size="12">
      Interactive visual generator exporting responsive CSS Grid and Flexbox snippets.
    </text>
    <text x="24" y="150" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">View Live Demo →</text>
  </g>
</svg>
